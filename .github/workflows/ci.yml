name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.8'

defaults:
  run:
    shell: bash

jobs:
  qualite:
    name: Analyse et tests (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test

  android:
    name: Build Android APK
    needs: qualite
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      # Version de production, et un APK par architecture de processeur.
      #
      # Un APK de débogage interprète le code Dart au lieu de l'exécuter
      # compilé : démarrage plusieurs fois plus lent, interface molle et
      # lecture saccadée. Il embarque en plus le moteur de diagnostic.
      # Découper par architecture évite d'emporter trois fois le moteur vidéo
      # natif : le téléphone n'en utilise qu'une.
      - name: Build APK (production, par architecture)
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      # Filet de sécurité : un APK unique, plus lourd, mais qui s'installe sur
      # n'importe quel téléphone si l'architecture est inconnue.
      - name: Build APK (production, universel)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Taille des APK produits
        run: ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Archivage APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: omnia-mobile-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
