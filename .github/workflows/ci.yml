name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.8'

defaults:
  run:
    shell: bash

jobs:
  qualite:
    name: Analyse et tests (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test

  android:
    name: Build Android APK
    needs: qualite
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Publier une version demande le droit d'écriture sur le dépôt.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      # Clé de signature reconstituée depuis les secrets du dépôt, jamais
      # écrite dans le code. Sans ces secrets, la compilation retombe sur la
      # clé historique présente dans le dépôt : c'est le repli de transition,
      # à supprimer une fois les secrets en place.
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.OMNIA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OMNIA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OMNIA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OMNIA_KEY_PASSWORD }}
        run: |
          # Test fait ici plutôt que dans une condition d'étape : la présence
          # d'un secret ne s'y évalue pas toujours comme on l'attend, et une
          # erreur d'expression ferait échouer toute la compilation.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Aucun secret de signature : la clé du dépôt est utilisée."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/omnia.jks"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/omnia.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      # Version de production, et un APK par architecture de processeur.
      #
      # Un APK de débogage interprète le code Dart au lieu de l'exécuter
      # compilé : démarrage plusieurs fois plus lent, interface molle et
      # lecture saccadée. Il embarque en plus le moteur de diagnostic.
      # Découper par architecture évite d'emporter trois fois le moteur vidéo
      # natif : le téléphone n'en utilise qu'une.
      #
      # --build-number : Android refuse une mise à jour dont le numéro de
      # version interne n'augmente pas. Le numéro d'exécution de la CI croît
      # toujours : une nouvelle compilation s'installe donc par-dessus la
      # précédente, sans désinstallation et sans perdre réglages ni historique.
      #
      # --dart-define : la même version est compilée dans l'application, où le
      # service de mise à jour la compare au tag publié. Sans elle il se croit
      # toujours en 0.1.0 et reproposerait la mise à jour en boucle, y compris
      # juste après une installation réussie.
      - name: Build APK (production, par architecture)
        run: |
          flutter build apk --release --split-per-abi \
            --build-name=0.1.${{ github.run_number }} \
            --build-number=${{ github.run_number }} \
            --dart-define=OMNIA_VERSION=0.1.${{ github.run_number }} \
            --android-skip-build-dependency-validation

      # Filet de sécurité : un APK unique, plus lourd, mais qui s'installe sur
      # n'importe quel téléphone si l'architecture est inconnue. C'est lui que
      # la mise à jour intégrée télécharge, faute de connaître l'architecture.
      - name: Build APK (production, universel)
        run: |
          flutter build apk --release \
            --build-name=0.1.${{ github.run_number }} \
            --build-number=${{ github.run_number }} \
            --dart-define=OMNIA_VERSION=0.1.${{ github.run_number }} \
            --android-skip-build-dependency-validation
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/omnia-mobile-universel.apk

      - name: Taille des APK produits
        run: ls -lh build/app/outputs/flutter-apk/*.apk

      # Version publiée d'abord : elle ne consomme pas le quota de stockage des
      # artefacts, contrairement à l'archivage ci-dessous, et ne périme pas.
      # C'est aussi là que la mise à jour intégrée de l'application va
      # chercher : elle interroge les « releases » du dépôt, jamais les
      # artefacts.
      - name: Publier la version téléchargeable
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.1.${{ github.run_number }}"
          gh release create "$tag" build/app/outputs/flutter-apk/*.apk \
            --title "OMNIA Mobile 0.1.${{ github.run_number }}" \
            --notes "Installation directe, par-dessus la version précédente : ni désinstallation ni perte de réglages.

          - **omnia-mobile-universel.apk** : fonctionne sur tous les téléphones. À prendre en cas de doute, et c'est celui que la mise à jour intégrée télécharge.
          - **app-arm64-v8a-release.apk** : le plus léger, pour les téléphones récents (64 bits).
          - **app-armeabi-v7a-release.apk** : pour les téléphones plus anciens (32 bits)."
