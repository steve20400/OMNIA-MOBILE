plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0.0"
}

android {
    namespace "dev.omnia.mobile"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "dev.omnia.mobile"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true

        // Pas de liste d'architectures figée ici : Gradle refuse qu'elle
        // coexiste avec le découpage par architecture demandé à la
        // compilation (--split-per-abi), qui produit un APK par processeur.
        // Flutter s'en charge : armeabi-v7a, arm64-v8a et x86_64.
    }

    // Clé de signature : hors du dépôt dès que possible.
    //
    // Elle est lue, dans l'ordre : le fichier android/key.properties (jamais
    // suivi par git), puis les variables d'environnement posées par la
    // compilation, puis la clé historique du dépôt. Ce dernier repli existe
    // pour ne rien casser pendant la transition ; il disparaîtra avec elle.
    //
    // Cette clé est l'identité de l'application : qui la détient peut signer
    // une fausse mise à jour qu'Android acceptera comme la vôtre.
    signingConfigs {
        release {
            def keyProps = new Properties()
            def keyPropsFile = rootProject.file("key.properties")
            if (keyPropsFile.exists()) {
                keyPropsFile.withReader("UTF-8") { reader -> keyProps.load(reader) }
            }

            def store = keyProps.getProperty("storeFile") ?: System.getenv("OMNIA_KEYSTORE_FILE")
            storeFile = store ? file(store) : file("omnia_keystore.jks")
            storePassword = keyProps.getProperty("storePassword") ?:
                System.getenv("OMNIA_KEYSTORE_PASSWORD") ?: "omniapass"
            keyAlias = keyProps.getProperty("keyAlias") ?:
                System.getenv("OMNIA_KEY_ALIAS") ?: "omnia"
            keyPassword = keyProps.getProperty("keyPassword") ?:
                System.getenv("OMNIA_KEY_PASSWORD") ?: "omniapass"
        }
        // La version de débogage porte la même signature que la production :
        // sans cela, l'une ne remplacerait pas l'autre et il faudrait
        // désinstaller entre deux essais.
        debug {
            storeFile = signingConfigs.release.storeFile
            storePassword = signingConfigs.release.storePassword
            keyAlias = signingConfigs.release.keyAlias
            keyPassword = signingConfigs.release.keyPassword
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

configurations.all {
    resolutionStrategy {
        force "androidx.core:core:1.15.0"
        force "androidx.core:core-ktx:1.15.0"
        force "androidx.browser:browser:1.8.0"
    }
}

dependencies {
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}

flutter {
    source "../.."
}
